name: Build Multi-Platform SNES/BS-X/Sufami ROMs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile on Ubuntu & Package ROMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Setup PVSnesLib
        run: |
          sudo apt-get update
          sudo apt-get install -y make wget curl unzip build-essential ca-certificates
          
          echo "PVSnesLib v4.6.0 Linux ZIP sürümü indiriliyor..."
          curl -L -s https://github.com/alekmaul/pvsneslib/releases/download/4.6.0/pvsneslib_460_64b_linux_release.zip -o /tmp/pvsneslib.zip
          
          sudo unzip -q /tmp/pvsneslib.zip -d /opt
          
          # devkitsnes klasörünü arşiv içinde nerede olursa olsun dinamik olarak bul
          DEVKIT_SRC=$(find /opt/pvsneslib -type d -name "devkitsnes" | head -n 1)
          if [ -z "$DEVKIT_SRC" ]; then
            echo "HATA: devkitsnes klasörü arşivde bulunamadı!"
            exit 1
          fi
          
          PVS_SRC=$(dirname "$DEVKIT_SRC")
          echo "Bulunan PVSnesLib kaynak kökü: $PVS_SRC"
          
          # İçeriği tertemiz bir şekilde /opt/pvsneslib altına taşı
          sudo rm -rf /opt/pvsneslib/*
          sudo cp -r "$PVS_SRC"/* /opt/pvsneslib/
          
          # Kök sembolik bağları kesin olarak kur
          sudo rm -rf /pvsneslib /devkitsnes
          sudo ln -sfn /opt/pvsneslib /pvsneslib
          sudo ln -sfn /opt/pvsneslib/devkitsnes /devkitsnes
          
          echo "--- Doğrulama: /opt/pvsneslib içeriği ---"
          ls -la /opt/pvsneslib
          
          # Çevresel değişkenleri tanımla
          echo "PVSNESLIB=/opt/pvsneslib" >> $GITHUB_ENV
          echo "DEVKITSNES=/opt/pvsneslib/devkitsnes" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/pvsneslib/devkitsnes/bin" >> $GITHUB_ENV

      - name: Build All Platform Variants
        run: |
          make clean
          make

      - name: Upload All ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snes-multisystem-roms-package
          path: |
            *_snes.sfc
            *_superfamicom.smc
            *_bsx.bsx
            *_sufamiturbo.sft
            *.sfc
