name: Build Multi-Platform SNES/BS-X/Sufami ROMs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile on Ubuntu & Package ROMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Clone PVSnesLib
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential git ca-certificates
          
          # Doğrudan resmi repoyu /opt/pvsneslib altına klonla
          echo "PVSnesLib reposu klonlanıyor..."
          sudo git clone --depth 1 https://github.com/alekmaul/pvsneslib.git /opt/pvsneslib
          
          # Kök dizin sembolik bağlarını garantiye al
          sudo rm -rf /pvsneslib /devkitsnes
          sudo ln -sfn /opt/pvsneslib /pvsneslib
          sudo ln -sfn /opt/pvsneslib/devkitsnes /devkitsnes
          
          # Çevresel değişkenleri tanımla
          echo "PVSNESLIB=/opt/pvsneslib" >> $GITHUB_ENV
          echo "DEVKITSNES=/opt/pvsneslib/devkitsnes" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/pvsneslib/devkitsnes/bin" >> $GITHUB_ENV

      - name: Build All Platform Variants
        run: |
          make clean
          make

      - name: Upload All ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snes-multisystem-roms-package
          path: |
            *_snes.sfc
            *_superfamicom.smc
            *_bsx.bsx
            *_sufamiturbo.sft
            *.sfc
