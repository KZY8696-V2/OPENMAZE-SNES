name: Build Multi-Platform SNES/BS-X/Sufami ROMs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile on Ubuntu & Package ROMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Setup Cleanly Separated SDKs
        run: |
          sudo apt-get update
          sudo apt-get install -y make wget curl unzip build-essential ca-certificates
          
          echo "PVSnesLib v4.6.0 Linux ZIP sürümü indiriliyor..."
          curl -L -s https://github.com/alekmaul/pvsneslib/releases/download/4.6.0/pvsneslib_460_64b_linux_release.zip -o /tmp/pvsneslib.zip
          
          sudo mkdir -p /tmp/extracted_pvs
          sudo unzip -q /tmp/pvsneslib.zip -d /tmp/extracted_pvs
          
          # Hedef dizinleri sıfırdan oluştur
          sudo rm -rf /opt/devkitsnes /opt/pvsneslib /devkitsnes /pvsneslib
          sudo mkdir -p /opt/devkitsnes /opt/pvsneslib
          
          # Arşivin içinden devkitsnes ve include klasörlerini dinamik olarak bul ve yerleştir
          DEVKIT_SRC=$(find /tmp/extracted_pvs -type d -name "devkitsnes" | head -n 1)
          if [ -n "$DEVKIT_SRC" ]; then
            sudo cp -r "$DEVKIT_SRC"/* /opt/devkitsnes/
          fi
          
          PVS_ROOT=$(dirname "$DEVKIT_SRC")
          if [ -d "$PVS_ROOT/include" ]; then
            sudo cp -r "$PVS_ROOT/include" /opt/pvsneslib/
          elif [ -d "$DEVKIT_SRC/include" ]; then
            sudo cp -r "$DEVKIT_SRC/include" /opt/pvsneslib/
          fi
          
          if [ -d "$PVS_ROOT/lib" ]; then
            sudo cp -r "$PVS_ROOT/lib" /opt/pvsneslib/
          elif [ -d "$DEVKIT_SRC/lib" ]; then
            sudo cp -r "$DEVKIT_SRC/lib" /opt/pvsneslib/
          fi
          
          # Kök dizin sembolik bağlarını kesin olarak kur
          sudo ln -sfn /opt/devkitsnes /devkitsnes
          sudo ln -sfn /opt/pvsneslib /pvsneslib
          
          echo "--- Kurulum Doğrulaması ---"
          ls -la /opt/devkitsnes
          ls -la /opt/devkitsnes/bin
          ls -la /opt/devkitsnes/include
          ls -la /opt/pvsneslib
          
          # Çevresel değişkenleri net yollarına göre tanımla
          echo "PVSNESLIB=/opt/pvsneslib" >> $GITHUB_ENV
          echo "DEVKITSNES=/opt/devkitsnes" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/devkitsnes/bin" >> $GITHUB_ENV

      - name: Build All Platform Variants
        run: |
          make clean
          make

      - name: Upload All ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snes-multisystem-roms-package
          path: |
            *_snes.sfc
            *_superfamicom.smc
            *_bsx.bsx
            *_sufamiturbo.sft
            *.sfc
