name: Build Multi-Platform SNES/BS-X/Sufami ROMs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile on Ubuntu & Package ROMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Dependencies & PVSnesLib
        run: |
          sudo apt-get update
          sudo apt-get install -y make wget curl unzip build-essential ca-certificates
          
          echo "PVSnesLib v4.6.0 Linux sürümü indiriliyor..."
          curl -L -s https://github.com/alekmaul/pvsneslib/releases/download/4.6.0/pvsneslib_460_64b_linux_release.zip -o /tmp/pvsneslib.zip
          
          sudo mkdir -p /opt/pvsneslib
          sudo unzip -q /tmp/pvsneslib.zip -d /tmp/extracted_pvs
          
          # İç içe açılan pvsneslib klasörlerini /opt/pvsneslib altına düzgünce hizala
          if [ -d "/tmp/extracted_pvs/pvsneslib" ]; then
            sudo cp -r /tmp/extracted_pvs/pvsneslib/* /opt/pvsneslib/
          else
            sudo cp -r /tmp/extracted_pvs/* /opt/pvsneslib/
          fi
          
          # /pvsneslib ve /devkitsnes kök bağlantılarını kesin olarak kur
          sudo rm -rf /pvsneslib /devkitsnes
          sudo ln -sfn /opt/pvsneslib /pvsneslib
          sudo ln -sfn /opt/pvsneslib/devkitsnes /devkitsnes
          
          # Çevresel değişkenleri tanımla
          echo "PVSNESLIB=/opt/pvsneslib" >> $GITHUB_ENV
          echo "DEVKITSNES=/opt/pvsneslib/devkitsnes" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/pvsneslib/devkitsnes/bin" >> $GITHUB_ENV

      - name: Build All Platform Variants
        run: |
          make clean
          make

      - name: Upload All ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snes-multisystem-roms-package
          path: |
            *_snes.sfc
            *_superfamicom.smc
            *_bsx.bsx
            *_sufamiturbo.sft
            *.sfc
