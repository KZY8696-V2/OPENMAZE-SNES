name: Build Multi-Platform SNES/BS-X/Sufami ROMs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile on Ubuntu & Package ROMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Dependencies & PVSnesLib
        run: |
          sudo apt-get update
          sudo apt-get install -y make git wget build-essential ca-certificates
          
          # PVSnesLib deposunu ve derleyicilerini sisteme klonla
          git clone --depth 1 https://github.com/easymode/pvsneslib.git /opt/pvsneslib || git clone --depth 1 https://github.com/araenas/pvsneslib.git /opt/pvsneslib
          
          # Çevresel değişkeni tanımla
          echo "PVSNESLIB=/opt/pvsneslib" >> $GITHUB_ENV

      - name: Build All Platform Variants
        run: |
          make clean
          make

      - name: Upload All ROM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snes-multisystem-roms-package
          path: |
            *_snes.sfc
            *_superfamicom.smc
            *_bsx.bsx
            *_sufamiturbo.sft
            *.sfc
